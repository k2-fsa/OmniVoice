services:
  omnivoice:
    build:
      dockerfile: Dockerfile.cpu
    image: omnivoice-ui:cpu
    environment:
      OMNIVOICE_DEVICE: cpu
      OMNIVOICE_BAMIBERT_MODEL: /models/bamibert
      OMNIVOICE_BAMIBERT_DEVICE: cpu
    volumes:
      - ${OMNIVOICE_BAMIBERT_HOST_PATH:-./artifacts/models/bamibert_augmented_best}:/models/bamibert:ro
